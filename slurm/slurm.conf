# MRIPrepCloud slurm.conf for Slurm 24.11.7 (built from source, prefix /usr/local, conf /etc/slurm). Deployed by deploy_shards.sh.
ClusterName=cluster
SlurmctldHost=Node1
MpiDefault=none
ProctrackType=proctrack/linuxproc
ReturnToService=2
SlurmctldPidFile=/var/run/slurmctld.pid
SlurmctldPort=6817
SlurmdPidFile=/var/run/slurmd.pid
SlurmdPort=6818
SlurmdSpoolDir=/var/spool/slurmd
SlurmUser=slurm
SlurmdUser=root
StateSaveLocation=/var/spool/slurmctld
SwitchType=switch/none
# GPU sharding: each physical GPU is split into N shards; a job asks for --gres=shard:1 and gets
# CUDA_VISIBLE_DEVICES of the GPU that shard belongs to. Shard counts per GPU are in gres.conf.
GresTypes=gpu,shard
# Backfill every 5 s (default 30 s): DeepPrep tasks are 1-7 min, so a 30-s backfill cycle leaves cores idle while
# the main scheduler stops at the first job that does not fit (e.g. a 6-core anat_sphere). Added 2026-10-14 13:50 CDT, during exp9 (min ~62).
SchedulerParameters=bf_interval=5,bf_continue,bf_max_job_test=500,bf_window=1440
# 24.11 defaults to priority/multifactor; with no weights every job gets priority 1 and --nice is ignored (found in exp9/exp10).
# priority/basic (the 19.05 default) = submit order adjusted by --nice, which the remaining-critical-path tables rely on.
PriorityType=priority/basic
SelectType=select/cons_tres
SelectTypeParameters=CR_CPU_Memory
DefMemPerCPU=2000
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=8
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmdDebug=info
SlurmctldDebug=info
SlurmctldLogFile=/var/log/slurm/slurmctld.log
DebugFlags=gres
NodeName=Node2 NodeAddr=192.168.1.2 CPUs=16 RealMemory=64000 Sockets=16 CoresPerSocket=1 ThreadsPerCore=1 Gres=gpu:1,shard:SHARDS_NODE2
NodeName=Node3 NodeAddr=192.168.1.3 CPUs=16 RealMemory=64000 Sockets=16 CoresPerSocket=1 ThreadsPerCore=1 Gres=gpu:2,shard:SHARDS_NODE3
NodeName=Node4 NodeAddr=192.168.1.4 CPUs=16 RealMemory=64000 Sockets=16 CoresPerSocket=1 ThreadsPerCore=1
# PriorityTier=2 removed 2026-10-14 15:23 (exp10, min 14): with it, Slurm holds GPU-node cores for pending gpu-node jobs that are only waiting for a shard, leaving spill cores idle. GPU jobs keep precedence via --nice; cores are reserved by spill_controller2.sh.
PartitionName=gpu-node Nodes=Node2,Node3 Default=NO MaxTime=INFINITE State=UP
PartitionName=cpu-node Nodes=Node4 Default=NO MaxTime=INFINITE State=UP
PartitionName=cpu-spill Nodes=Node2,Node3 Default=NO MaxTime=INFINITE State=UP MaxCPUsPerNode=12
# Per-node spill partitions so the elastic controller can set a different cap on each GPU node (exp10)
PartitionName=cpu-spill2 Nodes=Node2 Default=NO MaxTime=INFINITE State=UP MaxCPUsPerNode=12
PartitionName=cpu-spill3 Nodes=Node3 Default=NO MaxTime=INFINITE State=UP MaxCPUsPerNode=12
PartitionName=cpu-all Nodes=Node2,Node3,Node4 Default=NO MaxTime=INFINITE State=UP
